<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | QuickCart</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(255,255,255,0.55),
                    transparent 22%
                ),

                radial-gradient(
                    circle at 85% 80%,
                    rgba(255,255,255,0.30),
                    transparent 25%
                ),

                linear-gradient(
                    135deg,
                    #fff700 0%,
                    #ffd000 50%,
                    #ff9800 100%
                );
        }

        .reset-box {
            width: 390px;

            padding: 32px;

            background: rgba(255,255,255,0.97);

            border-radius: 24px;

            box-shadow:
                0 20px 55px rgba(0,0,0,0.25);
        }

        .logo {
            width: 60px;
            height: 60px;

            margin: 0 auto 12px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 17px;

            background:
                linear-gradient(
                    135deg,
                    #ffe000,
                    #ffad00
                );

            font-size: 30px;
        }

        h1 {
            text-align: center;

            color: #222;

            font-size: 25px;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #777;

            font-size: 13px;

            margin-bottom: 22px;
        }

        .error {
            background: #ffe5e5;

            color: #d60000;

            padding: 10px;

            border-radius: 8px;

            text-align: center;

            font-size: 13px;

            margin-bottom: 15px;
        }

        label {
            display: block;

            color: #333;

            font-size: 13px;

            font-weight: bold;

            margin-bottom: 7px;
        }

        input {
            width: 100%;

            height: 46px;

            padding: 0 13px;

            border: 1px solid #ddd;

            border-radius: 9px;

            background: #fafafa;

            outline: none;

            font-size: 13px;

            margin-bottom: 15px;
        }

        input:focus {
            background: white;

            border-color: #ffad00;

            box-shadow:
                0 0 0 3px rgba(255,174,0,0.13);
        }

        button {
            width: 100%;

            height: 47px;

            margin-top: 5px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #ffd900,
                    #ffad00
                );

            color: #222;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }

        .back-login {
            text-align: center;

            margin-top: 20px;

            color: #777;

            font-size: 13px;
        }

        .back-login a {
            color: #dc8700;

            font-weight: bold;

            text-decoration: none;
        }

        .back-login a:hover {
            text-decoration: underline;
        }

        @media (max-width: 450px) {

            .reset-box {
                width: calc(100% - 30px);

                padding: 27px;
            }
        }

    </style>

</head>

<body>

    <div class="reset-box">

        <div class="logo">
            🔑
        </div>

        <h1>
            Reset Password
        </h1>

        <p class="subtitle">
            Create a new password for your account
        </p>

        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <input
                type="hidden"
                name="login_id"
                value="{{ login_id }}"
            >

            <label>
                New Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter new password"
                required
            >

            <label>
                Confirm New Password
            </label>

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm new password"
                required
            >

            <button type="submit">
                UPDATE PASSWORD
            </button>

        </form>

        <div class="back-login">

            Remember your password?

            <a href="/login/">
                Login
            </a>

        </div>

    </div>

</body>

</html>
