<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify OTP - BuyZo</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff8dc, #ffe082);
        }

        .otp-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #2874f0;
            margin-bottom: 10px;
        }

        h2 {
            color: #222;
            margin-bottom: 10px;
        }

        .description {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .otp-input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 20px;
            text-align: center;
            letter-spacing: 6px;
            outline: none;
        }

        .otp-input:focus {
            border-color: #2874f0;
        }

        .verify-button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2874f0;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .verify-button:hover {
            background: #1255c5;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 6px;
            background: #fff3cd;
            color: #856404;
            font-size: 14px;
        }

        .development-otp {
            margin-top: 20px;
            padding: 12px;
            background: #e8f5e9;
            border-radius: 8px;
            color: #2e7d32;
            font-size: 14px;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #2874f0;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="otp-container">

        <div class="logo">
            BuyZo 🛒
        </div>

        <h2>Verify OTP</h2>

        <p class="description">
            Enter the 6-digit OTP generated for your password change.
        </p>

        {% if messages %}
            {% for message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <input
                type="text"
                name="otp"
                class="otp-input"
                placeholder="Enter OTP"
                maxlength="6"
                pattern="[0-9]{6}"
                inputmode="numeric"
                required
            >

            <button type="submit" class="verify-button">
                VERIFY OTP
            </button>
        </form>

        {% if development_otp %}
            <div class="development-otp">
                Development OTP:
                <strong>{{ development_otp }}</strong>
            </div>
        {% endif %}

        <a href="{% url 'account' %}" class="back-link">
            ← Back to Account
        </a>

    </div>

</body>
</html>
